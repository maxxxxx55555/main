[project]
name = "ai-employee-bot"
version = "0.2.0"
description = "Telegram AI-Сотрудник — виртуальный ассистент для малого бизнеса ($0-стек: SQLite + Groq/OpenRouter + ChromaDB)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "alembic>=1.13",
]

[project.optional-dependencies]
# $0-стек: локальный векторный поиск без внешних сервисов
chroma = ["chromadb>=0.5"]
# Необязательные тяжёлые зависимости (MVP работает без них — in-memory/SQLite)
prod = [
    "asyncpg>=0.29",
    "redis>=5.0",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ai-employee = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"