name: ai-employee

# Профиль по умолчанию: только app (SQLite, long polling) — нулевая инфраструктура.
# Prod: docker compose --profile prod up -d  (PostgreSQL+pgvector, Redis)

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # /health для мониторинга/LB; в prod можно закрыть firewall'ом и ходить через reverse-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/srv/data
    stop_grace_period: 30s  # graceful shutdown (§8.5)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: aiemployee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["prod"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: